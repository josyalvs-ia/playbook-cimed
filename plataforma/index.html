<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Jovens Aprendizes — CIMED</title>
<style>
:root{
  --amarelo:#ffc600; --amarelo-escuro:#e6b000; --amarelo-suave:#fff8e1; --amarelo-meio:#fff3c4;
  --preto:#0d0d0d; --preto-medio:#1a1a1a; --preto-suave:#242424;
  --cinza-bg:#f4f4f2; --cinza-claro:#ebebea; --cinza-bloco:#eeeeed;
  --cinza-borda:#e2e2df; --cinza-texto:#555; --cinza-sub:#8a8a8a;
  --branco:#fff;
  --verde:#1f9d57; --verde-bg:#e7f6ee;
  --vermelho:#d64545; --vermelho-bg:#fbeaea;
  --laranja:#e08a1e; --laranja-bg:#fbf1e0;
  --azul:#2b6cb0; --azul-bg:#e8f0f9;
  --fonte:'Inter','Helvetica Neue',Arial,sans-serif;
  --sombra:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sombra-md:0 4px 16px rgba(0,0,0,.08);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--fonte);background:var(--cinza-bg);color:var(--preto);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:250px;background:var(--preto);color:#fff;position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;z-index:100;transition:transform .25s;
}
.sb-brand{padding:22px 22px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-logo{background:var(--amarelo);border-radius:7px;padding:5px 11px;font-size:15px;font-weight:900;letter-spacing:.04em;color:var(--preto);}
.sb-brand-txt{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);line-height:1.5;}
.sb-nav{flex:1;padding:14px 12px;overflow-y:auto;}
.sb-sec{font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.28);padding:16px 14px 8px;}
.sb-link{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;
  font-size:13.5px;font-weight:600;color:rgba(255,255,255,.62);text-decoration:none;
  transition:.15s;position:relative;margin-bottom:2px;
}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.sb-link.active{background:var(--amarelo);color:var(--preto);}
.sb-link .ic{width:18px;height:18px;flex-shrink:0;}
.sb-link .badge{margin-left:auto;background:var(--vermelho);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;min-width:20px;text-align:center;}
.sb-link.active .badge{background:var(--preto);color:var(--amarelo);}
.sb-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:rgba(255,255,255,.32);}

.main{flex:1;margin-left:250px;display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  height:64px;background:var(--branco);border-bottom:1px solid var(--cinza-borda);
  display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:50;
}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.01em;}
.topbar .sub{font-size:12px;color:var(--cinza-sub);font-weight:500;margin-top:1px;}
.hamburger{display:none;background:none;border:none;flex-direction:column;gap:4px;padding:6px;}
.hamburger span{display:block;width:22px;height:2px;background:var(--preto);border-radius:2px;}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:12px;}
.bell{position:relative;width:40px;height:40px;border-radius:9px;border:1px solid var(--cinza-borda);background:var(--branco);display:flex;align-items:center;justify-content:center;color:var(--cinza-texto);}
.bell:hover{background:var(--cinza-bg);}
.bell .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--vermelho);border:2px solid var(--branco);}
.content{padding:28px;max-width:1240px;width:100%;margin:0 auto;flex:1;}

/* ── BOTÕES ── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:700;border:1px solid transparent;transition:.15s;white-space:nowrap;}
.btn .ic{width:16px;height:16px;}
.btn-primary{background:var(--amarelo);color:var(--preto);}
.btn-primary:hover{background:var(--amarelo-escuro);}
.btn-dark{background:var(--preto);color:#fff;}
.btn-dark:hover{background:var(--preto-suave);}
.btn-ghost{background:var(--branco);color:var(--preto);border-color:var(--cinza-borda);}
.btn-ghost:hover{background:var(--cinza-bg);}
.btn-sm{padding:7px 13px;font-size:12px;}
.btn-danger{background:var(--vermelho-bg);color:var(--vermelho);}
.btn-danger:hover{background:#f6dada;}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--cinza-sub);}
.btn-icon:hover{background:var(--cinza-claro);color:var(--preto);}

/* ── CARDS / KPI ── */
.grid{display:grid;gap:18px;}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:22px;}
.card{background:var(--branco);border:1px solid var(--cinza-borda);border-radius:var(--radius);box-shadow:var(--sombra);}
.kpi{padding:20px 22px;position:relative;overflow:hidden;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.kpi-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.kpi-ico .ic{width:20px;height:20px;}
.kpi-val{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1;}
.kpi-lbl{font-size:12.5px;color:var(--cinza-sub);font-weight:600;margin-top:7px;}
.kpi-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.ico-y{background:var(--amarelo-suave);color:var(--amarelo-escuro);}
.ico-g{background:var(--verde-bg);color:var(--verde);}
.ico-r{background:var(--vermelho-bg);color:var(--vermelho);}
.ico-o{background:var(--laranja-bg);color:var(--laranja);}
.ico-b{background:var(--azul-bg);color:var(--azul);}

.panel{padding:22px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.panel-head h2{font-size:15px;font-weight:800;}
.panel-head .link{font-size:12px;font-weight:700;color:var(--cinza-sub);text-decoration:none;}
.panel-head .link:hover{color:var(--preto);}
.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;}

/* ── GRÁFICOS ── */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.bar-lbl{font-size:12.5px;font-weight:600;width:120px;flex-shrink:0;color:var(--cinza-texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:22px;background:var(--cinza-bloco);border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;background:var(--amarelo);border-radius:6px;transition:width .6s;min-width:2px;}
.bar-val{font-size:12.5px;font-weight:800;width:34px;text-align:right;}
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.donut-legend{display:flex;flex-direction:column;gap:10px;}
.donut-legend .li{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;}
.donut-legend .dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}

/* ── FEED / LISTAS ── */
.feed-item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--cinza-claro);}
.feed-item:last-child{border-bottom:none;}
.feed-ico{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.feed-ico .ic{width:17px;height:17px;}
.feed-body{flex:1;min-width:0;}
.feed-title{font-size:13px;font-weight:700;line-height:1.4;}
.feed-sub{font-size:12px;color:var(--cinza-sub);margin-top:2px;}
.feed-time{font-size:11px;color:var(--cinza-sub);font-weight:600;white-space:nowrap;}

/* ── TABELA ── */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.search{flex:1;min-width:200px;position:relative;}
.search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--cinza-borda);border-radius:9px;font-size:13.5px;background:var(--branco);}
.search input:focus{outline:none;border-color:var(--amarelo);box-shadow:0 0 0 3px var(--amarelo-suave);}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--cinza-sub);}
select.filter{padding:11px 14px;border:1px solid var(--cinza-borda);border-radius:9px;font-size:13px;background:var(--branco);font-weight:600;color:var(--cinza-texto);}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--cinza-borda);background:var(--branco);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{background:var(--cinza-bg);text-align:left;padding:13px 16px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--cinza-sub);white-space:nowrap;border-bottom:1px solid var(--cinza-borda);}
tbody td{padding:13px 16px;border-bottom:1px solid var(--cinza-claro);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--amarelo-suave);}
.person{display:flex;align-items:center;gap:11px;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--preto);color:var(--amarelo);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.person .nm{font-weight:700;}
.person .em{font-size:11.5px;color:var(--cinza-sub);}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.p-ativo{background:var(--verde-bg);color:var(--verde);}
.p-afastado{background:var(--laranja-bg);color:var(--laranja);}
.p-desligado{background:var(--cinza-bloco);color:var(--cinza-sub);}
.p-pendente{background:var(--laranja-bg);color:var(--laranja);}
.p-assinado{background:var(--verde-bg);color:var(--verde);}
.p-enviado{background:var(--azul-bg);color:var(--azul);}
.p-aceito{background:var(--verde-bg);color:var(--verde);}
.p-vigente{background:var(--verde-bg);color:var(--verde);}
.p-vencido{background:var(--vermelho-bg);color:var(--vermelho);}
.p-encerrado{background:var(--cinza-bloco);color:var(--cinza-sub);}
.p-alerta{background:var(--vermelho-bg);color:var(--vermelho);}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}

/* ── EMPTY ── */
.empty{text-align:center;padding:56px 20px;color:var(--cinza-sub);}
.empty .ic{width:44px;height:44px;margin:0 auto 14px;color:var(--cinza-claro);}
.empty h3{font-size:15px;font-weight:800;color:var(--cinza-texto);margin-bottom:6px;}
.empty p{font-size:13px;margin-bottom:18px;}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(13,13,13,.55);z-index:300;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;backdrop-filter:blur(2px);}
.overlay.open{display:flex;}
.modal{background:var(--branco);border-radius:16px;width:100%;max-width:620px;box-shadow:var(--sombra-md);animation:pop .2s;margin:auto 0;}
.modal.wide{max-width:820px;}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}
.modal-head{padding:22px 26px;border-bottom:1px solid var(--cinza-borda);display:flex;align-items:center;justify-content:space-between;}
.modal-head h2{font-size:17px;font-weight:800;}
.modal-head .sub{font-size:12.5px;color:var(--cinza-sub);margin-top:2px;}
.modal-body{padding:24px 26px;max-height:65vh;overflow-y:auto;}
.modal-foot{padding:18px 26px;border-top:1px solid var(--cinza-borda);display:flex;gap:10px;justify-content:flex-end;background:var(--cinza-bg);border-radius:0 0 16px 16px;}
.close-x{width:34px;height:34px;border:none;background:var(--cinza-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--cinza-texto);}
.close-x:hover{background:var(--cinza-claro);}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12px;font-weight:700;color:var(--cinza-texto);}
.field label .req{color:var(--vermelho);}
.field input,.field select,.field textarea{
  padding:10px 13px;border:1px solid var(--cinza-borda);border-radius:9px;font-size:13.5px;background:var(--branco);width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amarelo);box-shadow:0 0 0 3px var(--amarelo-suave);}
.field textarea{resize:vertical;min-height:74px;}
.field .hint{font-size:11px;color:var(--cinza-sub);}
.dropzone{border:2px dashed var(--cinza-borda);border-radius:11px;padding:26px;text-align:center;cursor:pointer;transition:.15s;background:var(--cinza-bg);}
.dropzone:hover,.dropzone.drag{border-color:var(--amarelo);background:var(--amarelo-suave);}
.dropzone .ic{width:30px;height:30px;color:var(--cinza-sub);margin-bottom:8px;}
.dropzone p{font-size:13px;font-weight:600;color:var(--cinza-texto);}
.dropzone .sm{font-size:11.5px;color:var(--cinza-sub);margin-top:3px;}
.file-chip{display:flex;align-items:center;gap:10px;background:var(--amarelo-suave);border:1px solid var(--amarelo-meio);border-radius:9px;padding:10px 13px;margin-top:10px;}
.file-chip .ic{width:18px;height:18px;color:var(--amarelo-escuro);flex-shrink:0;}
.file-chip .nm{font-size:12.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── TOAST ── */
.toasts{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--preto);color:#fff;padding:14px 18px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:var(--sombra-md);display:flex;align-items:center;gap:11px;min-width:280px;max-width:400px;animation:slideIn .25s;}
.toast .ic{width:19px;height:19px;flex-shrink:0;}
.toast.ok{border-left:4px solid var(--verde);}
.toast.err{border-left:4px solid var(--vermelho);}
.toast.info{border-left:4px solid var(--amarelo);}
@keyframes slideIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:none;}}

/* ── DETALHE ── */
.detail-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.detail-avatar{width:60px;height:60px;border-radius:50%;background:var(--preto);color:var(--amarelo);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:2px;background:var(--cinza-borda);border-radius:10px;overflow:hidden;}
.info-cell{background:var(--branco);padding:14px 16px;}
.info-cell .k{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--cinza-sub);}
.info-cell .v{font-size:14px;font-weight:600;margin-top:4px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--cinza-borda);margin-bottom:20px;}
.tab{padding:11px 16px;font-size:13px;font-weight:700;color:var(--cinza-sub);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--preto);border-bottom-color:var(--amarelo);}
.section-title{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cinza-sub);margin:22px 0 12px;}

.alert-banner{display:flex;align-items:center;gap:12px;background:var(--amarelo-suave);border:1px solid var(--amarelo-meio);border-radius:11px;padding:14px 18px;margin-bottom:20px;font-size:13.5px;font-weight:600;}
.alert-banner .ic{width:20px;height:20px;color:var(--amarelo-escuro);flex-shrink:0;}
.alert-banner.warn{background:var(--vermelho-bg);border-color:#f2cccc;}
.alert-banner.warn .ic{color:var(--vermelho);}

.mono{font-variant-numeric:tabular-nums;}
.muted{color:var(--cinza-sub);}
.nowrap{white-space:nowrap;}
.stack-sm{display:flex;flex-direction:column;gap:3px;}

/* ── RESPONSIVO ── */
.overlay-nav{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;}
@media(max-width:960px){.two-col{grid-template-columns:1fr;}}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:none;}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .overlay-nav.open{display:block;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <span class="sb-logo">CIMED</span>
      <span class="sb-brand-txt">Gestão de<br>Jovens Aprendizes</span>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">Programa Jovem Aprendiz<br>© CIMED · Liderança em Movimento</div>
  </aside>
  <div class="overlay-nav" id="overlayNav"></div>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub">Visão geral do programa</div>
      </div>
      <div class="topbar-actions">
        <button class="bell" id="bellBtn" title="Alertas">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot" id="bellDot" style="display:none"></span>
        </button>
        <button class="btn btn-primary" id="quickAdd">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          Novo aprendiz
        </button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ============================================================
   GESTÃO DE JOVENS APRENDIZES — CIMED
   App client-side. Dados: localStorage. Arquivos: IndexedDB.
   Envio de e-mail: Netlify Function /enviar-email (Resend).
   ============================================================ */

/* ---------- ÍCONES (SVG inline) ---------- */
const IC = {
  dash:'<path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  sign:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>',

const DB={
  key:'cimed_aprendizes_v1',

  load(){
    try{this.data=JSON.parse(localStorage.getItem(this.key));}catch(e){this.data=null;}

    return this.data;
  },
  save(){localStorage.setItem(this.key,JSON.stringify(this.data));},
  reset(){this.data=seed();this.save();},
};
function uid(){return 'x'+Math.random().toString(36).slice(2,10);}

/* ---------- ARQUIVOS (IndexedDB) ---------- */
const Files={
  db:null,
  open(){
    return new Promise((res,rej)=>{
      if(this.db)return res(this.db);
      const r=indexedDB.open('cimed_files',1);
      r.onupgradeneeded=()=>{r.result.createObjectStore('files');};
      r.onsuccess=()=>{this.db=r.result;res(this.db);};
      r.onerror=()=>rej(r.error);
    });
  },
  async put(id,blob){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(blob,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});},
  async get(id){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('files','readonly');const rq=t.objectStore('files').get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});},
  async del(id){const db=await this.open();return new Promise((res)=>{const t=db.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=()=>res();});},
  async open_(id,nome){const b=await this.get(id);if(!b){toast('Arquivo não encontrado','err');return;}const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=nome||'arquivo';a.target='_blank';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);},
};

/* ---------- HELPERS ---------- */
function fmtData(iso){if(!iso)return '—';const [y,m,dd]=iso.split('-');return `${dd}/${m}/${y}`;}
function diasEntre(iso){if(!iso)return null;const alvo=new Date(iso+'T00:00:00');const h=new Date();h.setHours(0,0,0,0);return Math.round((alvo-h)/86400000);}
function idade(iso){if(!iso)return '—';const n=new Date(iso);const h=new Date();let a=h.getFullYear()-n.getFullYear();const m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))a--;return a+' anos';}
function iniciais(nome){return nome.split(' ').filter(Boolean).map(p=>p[0]).slice(0,2).join('').toUpperCase();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ap(id){return DB.data.aprendizes.find(a=>a.id===id);}
function nomeAp(id){const a=ap(id);return a?a.nome:'—';}
function contratoStatus(c){const dias=diasEntre(c.dataFim);if(dias===null)return 'vigente';if(dias<0)return 'vencido';return 'vigente';}

/* ---------- TOAST ---------- */
function toast(msg,tipo='ok'){
  const ic=tipo==='ok'?'check':tipo==='err'?'x':'warn';
  const el=document.createElement('div');
  el.className='toast '+tipo;
  el.innerHTML=svg(ic)+`<span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(30px)';el.style.transition='.3s';setTimeout(()=>el.remove(),300);},3800);
}

/* ---------- ALERTAS (derivados) ---------- */
function getAlertas(){
  const cfg=DB.data.config; const dd=cfg.alertaDias||30; const out=[];
  DB.data.contratos.forEach(c=>{
    const dias=diasEntre(c.dataFim); const a=ap(c.aprendizId); if(!a||a.status==='desligado')return;
    if(dias!==null&&dias<0) out.push({tipo:'contrato',nivel:'alto',ico:'file',icoCls:'ico-r',titulo:`Contrato vencido — ${a.nome}`,sub:`Venceu em ${fmtData(c.dataFim)}`,ord:dias});
    else if(dias!==null&&dias<=dd) out.push({tipo:'contrato',nivel:'medio',ico:'file',icoCls:'ico-o',titulo:`Contrato vence em ${dias} dia(s) — ${a.nome}`,sub:`Vencimento em ${fmtData(c.dataFim)}`,ord:dias});
  });
  DB.data.documentos.filter(d=>d.status==='pendente').forEach(d=>{
    const dias=diasEntre(d.prazo); const a=ap(d.aprendizId);
    const atras=dias!==null&&dias<0;
    out.push({tipo:'assinatura',nivel:atras?'alto':'medio',ico:'sign',icoCls:atras?'ico-r':'ico-o',
      titulo:`Assinatura pendente — ${d.titulo}`,
      sub:`${a?a.nome:''} · Líder ${d.lider}${d.prazo?` · prazo ${fmtData(d.prazo)}${atras?' (atrasado)':''}`:''}`,ord:dias===null?999:dias});
  });
  DB.data.convites.filter(c=>c.status==='pendente').forEach(c=>{
    out.push({tipo:'convite',nivel:'baixo',ico:'mail',icoCls:'ico-b',titulo:`Convite não enviado — ${c.nome}`,sub:`${c.email} · ${c.area||''}`,ord:500});
  });
  // aniversários próximos (7 dias)
  DB.data.aprendizes.filter(a=>a.status!=='desligado'&&a.dataNascimento).forEach(a=>{
    const n=a.dataNascimento; const hoje=new Date(); const aniv=new Date(hoje.getFullYear(),+n.slice(5,7)-1,+n.slice(8,10));
    let dias=Math.round((aniv-new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()))/86400000);
    if(dias<0)dias+=365;
    if(dias<=7) out.push({tipo:'aniversario',nivel:'baixo',ico:'cake',icoCls:'ico-y',titulo:`Aniversário — ${a.nome}`,sub:dias===0?'É hoje! 🎉':`Em ${dias} dia(s)`,ord:dias});
  });
  return out.sort((a,b)=>a.ord-b.ord);
}

function renderNav(){

}

        if(!linhas.length)return '<p class="muted" style="font-size:13px">Nenhum contrato cadastrado.</p>';
        return `<div class="table-wrap"><table><thead><tr><th>Aprendiz</th><th>Área</th><th>Vencimento</th><th>Situação</th></tr></thead><tbody>
          ${linhas.map(({c,dias,a})=>`<tr data-open-ap="${a.id}" style="cursor:pointer">
            <td><div class="person"><div class="avatar">${iniciais(a.nome)}</div><div class="stack-sm"><span class="nm">${esc(a.nome)}</span><span class="em">${esc(a.matricula)}</span></div></div></td>
            <td>${esc(a.area)}</td>
            <td class="mono nowrap">${fmtData(c.dataFim)}</td>
            <td>${dias<0?`<span class="pill p-vencido">Vencido há ${-dias}d</span>`:dias<=30?`<span class="pill p-alerta">Vence em ${dias}d</span>`:`<span class="pill p-vigente">${dias}d restantes</span>`}</td>
          </tr>`).join('')}
        </tbody></table></div>`;
      })()}
    </div>`;

  document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=(e)=>{e.preventDefault();go(el.dataset.goto);});
  document.querySelectorAll('[data-open-ap]').forEach(el=>el.onclick=()=>abrirAprendiz(el.dataset.openAp));
}

function filtrarAprendizes(){
  const q=filtroAp.q.toLowerCase();
  return DB.data.aprendizes.filter(a=>{
    if(filtroAp.status&&a.status!==filtroAp.status)return false;
    if(filtroAp.area&&a.area!==filtroAp.area)return false;
    if(q&&!(`${a.nome} ${a.matricula} ${a.email} ${a.lider} ${a.cpf}`.toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>a.nome.localeCompare(b.nome));

function renderTabelaAp(){
  const list=filtrarAprendizes();

function excluirAprendiz(id){

let filtroCt={q:'',status:''};
function viewContratos(){
  document.getElementById('view').innerHTML=`
    <div class="alert-banner">${svg('file')}Anexe os contratos de aprendizagem (PDF). Os arquivos ficam salvos com segurança neste navegador (IndexedDB).</div>
    <div class="toolbar">
      <div class="search">${svg('search')}<input id="qCt" placeholder="Buscar por aprendiz, tipo..." value="${esc(filtroCt.q)}"></div>
      <select class="filter" id="fCtStatus"><option value="">Todas as situações</option><option value="vigente">Vigentes</option><option value="vencido">Vencidos</option></select>
      <button class="btn btn-primary btn-sm" id="novoCt">${svg('upload')}Anexar contrato</button>
    </div>
    <div id="tabelaCt"></div>`;
  document.getElementById('fCtStatus').value=filtroCt.status;
  document.getElementById('qCt').oninput=e=>{filtroCt.q=e.target.value;renderTabelaCt();};
  document.getElementById('fCtStatus').onchange=e=>{filtroCt.status=e.target.value;renderTabelaCt();};
  document.getElementById('novoCt').onclick=()=>modalContrato();
  renderTabelaCt();
}
function renderTabelaCt(){
  const q=filtroCt.q.toLowerCase();
  let list=DB.data.contratos.map(c=>({c,a:ap(c.aprendizId),st:contratoStatus(c),dias:diasEntre(c.dataFim)}));
  list=list.filter(x=>x.a).filter(x=>{
    if(filtroCt.status&&x.st!==filtroCt.status)return false;
    if(q&&!(`${x.a.nome} ${x.c.tipo}`.toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>(a.dias??1e9)-(b.dias??1e9));
  const el=document.getElementById('tabelaCt');
  if(!list.length){el.innerHTML=`<div class="card"><div class="empty">${svg('file','ic')}<h3>Nenhum contrato</h3><p>Anexe o primeiro contrato de aprendizagem.</p><button class="btn btn-primary" onclick="modalContrato()">${svg('upload')}Anexar contrato</button></div></div>`;return;}
  el.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Aprendiz</th><th>Tipo</th><th>Início</th><th>Fim</th><th>Arquivo</th><th>Situação</th><th></th></tr></thead><tbody>
  ${list.map(({c,a,st,dias})=>`<tr>
    <td><div class="person"><div class="avatar">${iniciais(a.nome)}</div><span class="nm">${esc(a.nome)}</span></div></td>
    <td>${esc(c.tipo)}</td>
    <td class="mono nowrap">${fmtData(c.dataInicio)}</td>
    <td class="mono nowrap">${fmtData(c.dataFim)}${st==='vigente'&&dias!==null&&dias<=30&&dias>=0?`<br><span style="font-size:11px;color:var(--laranja);font-weight:700">${dias}d</span>`:''}</td>
    <td>${c.arquivoId?`<button class="btn btn-ghost btn-sm" onclick="Files.open_('${c.arquivoId}','${esc(c.arquivoNome)}')">${svg('download')}${esc((c.arquivoNome||'arquivo').slice(0,18))}</button>`:'<span class="muted" style="font-size:12px">sem arquivo</span>'}</td>
    <td><span class="pill p-${st}">${st}</span></td>
    <td><div class="row-actions">
      <button class="btn-icon" title="Editar" onclick="modalContrato('${c.id}')">${svg('edit')}</button>
      <button class="btn-icon" title="Excluir" onclick="excluirContrato('${c.id}')">${svg('trash')}</button>
    </div></td>
  </tr>`).join('')}
  </tbody></table></div>`;
}
let arquivoBuffer=null;
function modalContrato(id,aprendizId){
  const c=id?DB.data.contratos.find(x=>x.id===id):{};
  arquivoBuffer=null;
  const opts=DB.data.aprendizes.filter(a=>a.status!=='desligado'||a.id===c.aprendizId).map(a=>`<option value="${a.id}" ${(c.aprendizId||aprendizId)===a.id?'selected':''}>${esc(a.nome)} — ${esc(a.matricula)}</option>`).join('');
  openModal(`${id?'Editar':'Anexar'} contrato`,'Vincule o documento a um aprendiz',`
    <div class="form-grid">
      <div class="field full"><label>Aprendiz <span class="req">*</span></label><select id="c_ap">${opts}</select></div>
      <div class="field"><label>Tipo</label><input id="c_tipo" value="${esc(c.tipo||'Contrato de Aprendizagem')}"></div>
      <div class="field"><label></label><span></span></div>
      <div class="field"><label>Início da vigência</label><input id="c_ini" type="date" value="${esc(c.dataInicio||'')}"></div>
      <div class="field"><label>Fim da vigência</label><input id="c_fim" type="date" value="${esc(c.dataFim||'')}"></div>
      <div class="field full"><label>Arquivo do contrato (PDF, imagem, doc)</label>
        <div class="dropzone" id="dz">${svg('upload','ic')}<p>Clique ou arraste o arquivo aqui</p><div class="sm">PDF, JPG, PNG, DOCX · até ~15 MB</div></div>
        <input type="file" id="c_file" hidden accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
        <div id="fileInfo">${c.arquivoNome?`<div class="file-chip">${svg('file')}<span class="nm">${esc(c.arquivoNome)}</span><span class="muted" style="font-size:11px">(atual)</span></div>`:''}</div>
      </div>
    </div>`,
    [{label:id?'Salvar':'Anexar contrato',cls:'btn-primary',fn:async()=>{
      const apId=val('c_ap'); if(!apId){toast('Selecione o aprendiz','err');return false;}
      const obj={aprendizId:apId,tipo:val('c_tipo'),dataInicio:val('c_ini'),dataFim:val('c_fim')};
      if(arquivoBuffer){
        const fid=uid();
        try{await Files.put(fid,arquivoBuffer.blob);}catch(e){toast('Falha ao salvar arquivo','err');return false;}
        obj.arquivoId=fid;obj.arquivoNome=arquivoBuffer.nome;
      }
      if(id){Object.assign(c,obj);toast('Contrato atualizado');}
      else{obj.id=uid();obj.createdAt=nowISO();if(!obj.arquivoId){obj.arquivoId=null;obj.arquivoNome=null;}DB.data.contratos.push(obj);toast('Contrato anexado');}
      DB.save();closeModal();renderNav();if(ROTA==='contratos')renderTabelaCt();else go('contratos');
    }}]);
  const dz=document.getElementById('dz'),fi=document.getElementById('c_file');
  dz.onclick=()=>fi.click();
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};
  dz.ondragleave=()=>dz.classList.remove('drag');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');if(e.dataTransfer.files[0])pegarArquivo(e.dataTransfer.files[0]);};
  fi.onchange=e=>{if(e.target.files[0])pegarArquivo(e.target.files[0]);};
}
function pegarArquivo(file){
  if(file.size>16*1024*1024){toast('Arquivo muito grande (máx ~15 MB)','err');return;}
  arquivoBuffer={blob:file,nome:file.name};
  document.getElementById('fileInfo').innerHTML=`<div class="file-chip">${svg('file')}<span class="nm">${esc(file.name)}</span><span class="muted" style="font-size:11px">${(file.size/1024/1024).toFixed(1)} MB</span></div>`;
}
function excluirContrato(id){
  const c=DB.data.contratos.find(x=>x.id===id);
  confirmar('Excluir contrato?','O arquivo anexado também será removido.',async()=>{
    if(c.arquivoId)await Files.del(c.arquivoId);
    DB.data.contratos=DB.data.contratos.filter(x=>x.id!==id);
    DB.save();toast('Contrato excluído');renderNav();renderTabelaCt();
  });
}

/* ============================================================
   ENVIO DE E-MAIL (Netlify Function + fallback mailto)
   ============================================================ */
async function dispararEmail({to,subject,html,texto,replyTo,okMsg,onOk,contexto}){
  // tenta a function; se falhar, oferece fallback mailto
  let loading=toast('Enviando e-mail...','info');
  try{
    const resp=await fetch('/.netlify/functions/enviar-email',{
      method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({to,subject,html,replyTo:replyTo||undefined}),
    });
    const data=await resp.json().catch(()=>({}));
    if(resp.ok&&!data.error){toast(okMsg||'E-mail enviado','ok');onOk&&onOk();return;}
    throw new Error(data.error||('HTTP '+resp.status));
  }catch(err){
    // fallback: abre cliente de e-mail
    const ok=confirm(`Não foi possível enviar automaticamente (${err.message}).\n\nDeseja abrir seu programa de e-mail para enviar manualmente?`);
    if(ok){
      const mail=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(texto||'')}`;
      window.location.href=mail;
      onOk&&onOk();
    }
    toast('Envio automático indisponível — verifique a chave RESEND_API_KEY','err');
  }
}

function viewRelatorios(){
  const A=DB.data.aprendizes;
  const ativos=A.filter(a=>a.status==='ativo');
  const porArea={},porLider={},porInst={};
  ativos.forEach(a=>{porArea[a.area]=(porArea[a.area]||0)+1;porLider[a.lider]=(porLider[a.lider]||0)+1;porInst[a.instituicao]=(porInst[a.instituicao]||0)+1;});
  const docs=DB.data.documentos;
  const taxaAssin=docs.length?Math.round(docs.filter(d=>d.status==='assinado').length/docs.length*100):0;
  const conv=DB.data.convites;
  const taxaAceite=conv.length?Math.round(conv.filter(c=>c.status==='aceito').length/conv.length*100):0;
  // tempo médio de casa (ativos)
  const temposMeses=ativos.filter(a=>a.dataAdmissao).map(a=>{const d=(new Date()-new Date(a.dataAdmissao))/86400000/30.4;return d;});
  const mediaMeses=temposMeses.length?Math.round(temposMeses.reduce((s,x)=>s+x,0)/temposMeses.length):0;

  const barras=(obj,cor)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...e.map(x=>x[1]));return e.length?e.map(([k,v])=>`<div class="bar-row"><span class="bar-lbl">${esc(k||'—')}</span><div class="bar-track"><div class="bar-fill" style="width:${v/mx*100}%;background:${cor||'var(--amarelo)'}"></div></div><span class="bar-val">${v}</span></div>`).join(''):'<p class="muted" style="font-size:13px">Sem dados.</p>';};

  const kpi=(cls,ico,val,lbl)=>`<div class="card kpi"><div class="kpi-top"><div class="kpi-ico ${cls}">${svg(ico)}</div></div><div class="kpi-val">${val}</div><div class="kpi-lbl">${lbl}</div></div>`;

  document.getElementById('view').innerHTML=`
    <div class="toolbar"><div style="flex:1"></div>
      <button class="btn btn-ghost btn-sm" onclick="exportarAprendizesCSV()">${svg('download')}Aprendizes (CSV)</button>
      <button class="btn btn-ghost btn-sm" onclick="exportarContratosCSV()">${svg('download')}Contratos (CSV)</button>
    </div>
    <div class="grid kpi-grid">
      ${kpi('ico-g','users',ativos.length,'Aprendizes ativos')}
      ${kpi('ico-b','briefcase',mediaMeses+' m','Tempo médio de programa')}
      ${kpi('ico-y','sign',taxaAssin+'%','Documentos assinados')}
      ${kpi('ico-o','mail',taxaAceite+'%','Taxa de aceite de convites')}
    </div>
    <div class="two-col">
      <div class="card panel"><div class="panel-head"><h2>Aprendizes por área</h2></div>${barras(porArea)}</div>
      <div class="card panel"><div class="panel-head"><h2>Por instituição de ensino</h2></div>${barras(porInst,'#2b6cb0')}</div>
    </div>
    <div class="card panel" style="margin-top:18px"><div class="panel-head"><h2>Aprendizes por líder</h2></div>${barras(porLider,'#1f9d57')}</div>`;
}

/* ---------- EXPORTAÇÃO CSV ---------- */
function baixarCSV(nome,linhas){
  const csv='﻿'+linhas.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('CSV exportado');
}
function exportarAprendizesCSV(){
  const head=['Nome','CPF','Matrícula','E-mail','Telefone','Área','Líder','Instituição','Curso','Admissão','Fim contrato','Status'];
  const rows=DB.data.aprendizes.map(a=>[a.nome,a.cpf,a.matricula,a.email,a.telefone,a.area,a.lider,a.instituicao,a.curso,fmtData(a.dataAdmissao),fmtData(a.dataFimContrato),a.status]);
  baixarCSV('aprendizes_cimed.csv',[head,...rows]);
}
function exportarContratosCSV(){

    <div class="card panel" style="max-width:640px;margin-top:18px">
      <div class="panel-head"><h2>Dados</h2></div>
      <p style="font-size:13.5px;color:var(--cinza-texto);line-height:1.6">Os dados ficam salvos neste navegador. Exporte para backup ou restaure os dados de demonstração.</p>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="exportarAprendizesCSV()">${svg('download')}Exportar aprendizes</button>
        <button class="btn btn-ghost btn-sm" onclick="exportarBackup()">${svg('download')}Backup (JSON)</button>
        <button class="btn btn-danger btn-sm" onclick="resetarDados()">${svg('trash')}Restaurar dados demo</button>
      </div>
    </div>`;
}
function salvarConfig(){
  const c=DB.data.config;
  c.empresa=val('cfg_empresa');c.responsavel=val('cfg_resp');c.responsavelEmail=val('cfg_respEmail');
  c.alertaDias=parseInt(val('cfg_dias'))||30;
  DB.save();toast('Preferências salvas');renderNav();
}
function exportarBackup(){
  const blob=new Blob([JSON.stringify(DB.data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='backup_aprendizes_cimed.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('Backup exportado');
}
function resetarDados(){
  confirmar('Restaurar dados de demonstração?','Isso substitui todos os dados atuais pelos dados de exemplo.',()=>{DB.reset();toast('Dados restaurados');renderNav();go('dashboard');});
}

/* ============================================================
   MODAL / CONFIRM GENÉRICO
   ============================================================ */
let modalActions=[];
function openModal(titulo,sub,bodyHTML,actions,wide){
  modalActions=actions||[];
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="modal ${wide||''}">
    <div class="modal-head"><div><h2>${esc(titulo)}</h2>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div><button class="close-x" onclick="closeModal()">${svg('x')}</button></div>
    <div class="modal-body">${bodyHTML}</div>
    ${modalActions.length?`<div class="modal-foot">${modalActions.map((a,i)=>`<button class="btn ${a.cls||'btn-ghost'}" data-act="${i}">${esc(a.label)}</button>`).join('')}</div>`:''}
  </div>`;
  ov.classList.add('open');
  ov.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const a=modalActions[+b.dataset.act];const r=await a.fn();/* fn retorna false p/ manter aberto */});
  ov.onclick=e=>{if(e.target===ov)closeModal();};
}
function closeModal(){const ov=document.getElementById('overlay');ov.classList.remove('open');ov.innerHTML='';}
function confirmar(titulo,sub,fn){
  openModal(titulo,sub,`<p style="font-size:14px;color:var(--cinza-texto);line-height:1.6">${sub?'':'Confirme a ação.'}</p>`,
    [{label:'Cancelar',cls:'btn-ghost',fn:()=>closeModal()},
     {label:'Confirmar',cls:'btn-danger',fn:()=>{fn();closeModal();}}]);
}
function val(id){const e=document.getElementById(id);return e?e.value:'';}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
document.getElementById('hamburger').onclick=()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlayNav').classList.toggle('open');};
document.getElementById('overlayNav').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlayNav').classList.remove('open');};
document.getElementById('quickAdd').onclick=()=>modalAprendiz();
document.getElementById('bellBtn').onclick=()=>go('alertas');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

DB.load();
renderNav();
// landing por convite (?convite=token)
const params=new URLSearchParams(location.search);
if(params.get('convite')){
  const t=params.get('convite');const c=DB.data.convites.find(x=>x.token===t);
  setTimeout(()=>{
    openModal('Bem-vindo ao Programa Jovem Aprendiz','Cadastro via convite',
      `<p style="font-size:14px;line-height:1.7">Olá${c?', '+esc(c.nome.split(' ')[0]):''}! Que bom ter você aqui. 🎉<br><br>Este é o link de cadastro do programa Jovem Aprendiz da CIMED. Numa versão conectada ao backend, aqui o candidato preencheria seus dados. Por enquanto, o RH pode registrá-lo pela base de aprendizes.</p>`,
      [{label:'Entendi',cls:'btn-primary',fn:()=>{history.replaceState(null,'',location.pathname);closeModal();}}]);
  },300);
}
go('dashboard');
</script>
